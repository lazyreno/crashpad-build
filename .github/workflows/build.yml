name: Build Crashpad SDK
on:
  # Rebuild on demand when validating a pinned source or runner change.
  workflow_dispatch:
    inputs:
      sdkVersion:
        description: SDK version to publish
        required: true
        default: 20260915.1
  # Main and tag pushes are the producer-side validation and release paths.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    # Documentation-only changes do not consume four-platform build minutes.
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 scripts/generate-github-matrix.py --github-output "$GITHUB_OUTPUT"
  build-sdk:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Provision depot_tools
        shell: bash
        run: |
          git clone --no-checkout https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          git -C "$RUNNER_TEMP/depot_tools" checkout 36a8df4ad006eaa0572fb446edb8145fe5403592
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/depot_tools/.cipd_bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          cd "$RUNNER_TEMP/depot_tools" && ./update_depot_tools && ./cipd_bin_setup.sh && ./ensure_bootstrap
          if [[ "$RUNNER_OS" == "Windows" ]]; then gclient.bat --version; else gclient --version; fi
      - name: Fetch pinned Crashpad
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/crashpad/crashpad "${{ runner.temp }}/crashpad"
          git -C "${{ runner.temp }}/crashpad" checkout db44314646cbd0825a73b58dd2b7b5f4faca64a7
          cd "${{ runner.temp }}"
          gclient config --name=crashpad https://chromium.googlesource.com/crashpad/crashpad.git
          gclient sync --no-history --revision src@db44314646cbd0825a73b58dd2b7b5f4faca64a7

      - name: Build macOS SDK
        if: matrix.os == 'macos'
        env:
          SDK_ARCH: ${{ matrix.arch }}
          CRASHPAD_SRC: ${{ runner.temp }}/crashpad
          SDK_STAGE: ${{ runner.temp }}/sdk
        run: |
          export PATH="$RUNNER_TEMP/buildtools/mac:$RUNNER_TEMP/depot_tools/.cipd_bin:$RUNNER_TEMP/depot_tools:$PATH"
          command -v gn
          command -v autoninja
          scripts/build-macos.sh
      - name: Build Windows SDK
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SDK_ARCH: ${{ matrix.arch }}
          CRASHPAD_SRC: ${{ runner.temp }}/crashpad
          SDK_STAGE: ${{ runner.temp }}/sdk
        run: |
          $env:Path = "$env:RUNNER_TEMP\buildtools\win;$env:RUNNER_TEMP\depot_tools\.cipd_bin;$env:RUNNER_TEMP\depot_tools;$env:Path"
          Get-Command gn -ErrorAction Stop
          Get-Command autoninja -ErrorAction Stop
          ./scripts/build-windows.ps1
      - name: Stage SDK metadata and package files
        shell: bash
        env:
          SDK_STAGE: '${{ runner.temp }}/sdk'
          CRASHPAD_SRC: '${{ runner.temp }}/crashpad'
          SDK_VERSION: "${{ inputs.sdkVersion || '20260915.1' }}"
          PLATFORM: '${{ matrix.key }}'
        run: scripts/stage-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crashpad-sdk-${{ matrix.key }}
          path: ${{ runner.temp }}/sdk
  publish-release:
    needs: build-sdk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archive SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist/*; do name=$(basename "$d"); (cd dist && zip -qr "../release/${name}.zip" "$name"); sha256sum "release/${name}.zip" > "release/${name}.zip.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.sdkVersion || github.ref_name }}
          files: release/*
