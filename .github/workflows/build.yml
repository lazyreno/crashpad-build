name: Build Crashpad SDK
on:
  # Rebuild on demand when validating a pinned source or runner change.
  workflow_dispatch:
  # Main and tag pushes are the producer-side validation and release paths.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    # Documentation-only changes do not consume four-platform build minutes.
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 scripts/generate-github-matrix.py --github-output "$GITHUB_OUTPUT"
  build-sdk:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Provision depot_tools
        shell: bash
        run: |
          depot_tools_repository="$(python3 -c 'import json; print(json.load(open("config/source-lock.json"))["depotToolsRepository"])')"
          depot_tools_revision="$(python3 -c 'import json; print(json.load(open("config/source-lock.json"))["depotToolsRevision"])')"
          git clone --no-checkout "$depot_tools_repository" "$RUNNER_TEMP/depot_tools"
          git -C "$RUNNER_TEMP/depot_tools" checkout "$depot_tools_revision"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/depot_tools/.cipd_bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          cd "$RUNNER_TEMP/depot_tools" && ./update_depot_tools && ./cipd_bin_setup.sh && ./ensure_bootstrap
          if [[ "$RUNNER_OS" == "Windows" ]]; then gclient.bat --version; else gclient --version; fi
      - name: Fetch pinned Crashpad
        shell: bash
        run: |
          crashpad_repository="$(python3 -c 'import json; print(json.load(open("config/source-lock.json"))["crashpadRepository"])')"
          crashpad_revision="$(python3 -c 'import json; print(json.load(open("config/source-lock.json"))["crashpadRevision"])')"
          crashpad_source="${{ runner.temp }}/crashpad"
          for attempt in 1 2 3; do
            if git clone "$crashpad_repository" "$crashpad_source" && git -C "$crashpad_source" checkout "$crashpad_revision"; then
              break
            fi
            rm -rf "$crashpad_source"
            if [[ "$attempt" == 3 ]]; then exit 1; fi
          done
          cd "${{ runner.temp }}"
          gclient config --name=crashpad "${crashpad_repository}.git"
          gclient sync --no-history --revision "src@${crashpad_revision}"

      - name: Verify native ARM64 MSVC toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "ARM64 SDK builds require a native ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $compiler = Join-Path $installation 'VC\Tools\MSVC\14.44.35207\bin\HostARM64\ARM64\cl.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            throw "Native ARM64 MSVC 14.44.35207 was not found: $compiler"
          }
          Write-Host "[BUILD] Native ARM64 MSVC compiler: $compiler"

      - name: Build macOS SDK
        if: matrix.os == 'macos'
        env:
          SDK_ARCH: ${{ matrix.arch }}
          SDK_CONFIGURATION: ${{ matrix.configuration }}
          SDK_MINIMUM_SYSTEM_VERSION: ${{ matrix.minimumSystemVersion }}
          CRASHPAD_SRC: ${{ runner.temp }}/crashpad
          CRASHPAD_RUN_UPSTREAM_TESTS: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          export PATH="$RUNNER_TEMP/buildtools/mac:$RUNNER_TEMP/depot_tools/.cipd_bin:$RUNNER_TEMP/depot_tools:$PATH"
          command -v gn
          command -v autoninja
          scripts/build-macos.sh
      - name: Build Windows SDK
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SDK_ARCH: ${{ matrix.arch }}
          SDK_CONFIGURATION: ${{ matrix.configuration }}
          CRASHPAD_SRC: ${{ runner.temp }}/crashpad
          CRASHPAD_RUN_UPSTREAM_TESTS: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $env:Path = "$env:RUNNER_TEMP\buildtools\win;$env:RUNNER_TEMP\depot_tools\.cipd_bin;$env:RUNNER_TEMP\depot_tools;$env:Path"
          Get-Command gn -ErrorAction Stop
          Get-Command autoninja -ErrorAction Stop
          ./scripts/build-windows.ps1
      - name: Stage SDK metadata and package files
        shell: bash
        env:
          SDK_STAGE: '${{ runner.temp }}/sdk'
          CRASHPAD_SRC: '${{ runner.temp }}/crashpad'
          SDK_OS: '${{ matrix.os }}'
          SDK_ARCH: '${{ matrix.arch }}'
          SDK_CONFIGURATION: '${{ matrix.configuration }}'
          SDK_MINIMUM_SYSTEM_VERSION: '${{ matrix.minimumSystemVersion }}'
        run: |
          scripts/stage-sdk.sh
          python3 scripts/validate-sdk-layout.py "$RUNNER_TEMP/sdk" --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --configuration '${{ matrix.configuration }}' --minimum-system-version '${{ matrix.minimumSystemVersion }}'
          python3 scripts/validate-client-database-symbol.py "$RUNNER_TEMP/sdk"
          if [[ '${{ matrix.os }}' == 'macos' ]]; then
            python3 scripts/validate-macos-sdk-minos.py --sdk-root "$RUNNER_TEMP/sdk" --minimum-system-version '${{ matrix.minimumSystemVersion }}'
          else
            python3 scripts/validate-windows-sdk-subsystem.py --sdk-root "$RUNNER_TEMP/sdk" --minimum-system-version '${{ matrix.minimumSystemVersion }}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crashpad-sdk-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.configuration }}
          path: ${{ runner.temp }}/sdk
  publish-release:
    needs: build-sdk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          sdk_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["sdkVersion"])')"
          expected_tag="v${sdk_version}"
          release_tag="${REF_NAME}"
          [[ "${release_tag}" == "${expected_tag}" ]] || {
            echo "release tag must match sdkVersion: expected ${expected_tag}, got ${release_tag}" >&2
            exit 1
          }
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
      - name: Archive SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist/*; do name=$(basename "$d"); (cd dist && zip -qr "../release/${name}.zip" "$name"); sha256sum "release/${name}.zip" > "release/${name}.zip.sha256"; done
      - name: Generate artifact index
        shell: bash
        run: |
          python3 scripts/generate-artifact-index.py \
            --release-assets release \
            --output release/artifact-index.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.release.outputs.tag }}" \
            --release-tag "${{ steps.release.outputs.tag }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release/*.zip
            release/*.zip.sha256
            release/artifact-index.json
